<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        AgriConnect Login
    </title>

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />

</head>

<body>

    <!-- CURSOR -->

    <div class="cursor-glow"></div>

    <!-- BACKGROUND GLOW -->

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- =========================
         AUTH WRAPPER
    ========================== -->

    <section class="auth-wrapper">

        <!-- LEFT -->

        <div class="auth-left">

            <span class="auth-tag">
                AGRICONNECT ACCESS
            </span>

            <h1>
                Welcome Back
            </h1>

            <p>
                Access the intelligent agriculture ecosystem
                connecting farmers, buyers, and smart
                marketplace solutions.
            </p>

        </div>

        <!-- RIGHT -->

        <div class="auth-right">

            <div class="auth-card">

                <h2>
                    Login
                </h2>

                <!-- FORM -->

                <form
                    id="loginForm"
                    class="login-form"
                >

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        />

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        />

                    </div>

                    <!-- OPTIONS -->

                    <div class="auth-options">

                        <label class="remember">

                            <input type="checkbox" />

                            Remember me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Login
                    </button>

                </form>

                <!-- FOOTER -->

                <div class="auth-footer">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- JS -->

    <script src="./js/effects.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
