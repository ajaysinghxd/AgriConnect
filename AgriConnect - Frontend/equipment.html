<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    AgriConnect | Equipment
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

</head>

<body onload="initEquipmentPage()">

  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <nav class="navbar">

    <a
      href="index.html"
      class="logo"
    >
      🌿 AgriConnect
    </a>

    <button
      class="menu-btn"
      onclick="toggleMenu()"
    >
      ☰
    </button>

    <div
      class="nav-links"
      id="navLinks"
    >

      <a href="index.html">
        Home
      </a>

      <a href="buyer.html">
        Buyer
      </a>

      <a href="farmer.html">
        Farmer
      </a>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </nav>

  <!-- ========================= -->
  <!-- HERO SECTION -->
  <!-- ========================= -->

  <header class="dashboard-hero equipment-hero">

    <div>

      <span class="badge">
        Equipment Dashboard
      </span>

      <h1>
        Farm Equipment Rental 🚜
      </h1>

      <p id="userDetails">
        Rent and list farming equipment easily
      </p>

    </div>

    <div class="cart-pill">

      Listed:
      <span id="listedEquipment">
        0
      </span>

    </div>

  </header>

  <!-- ========================= -->
  <!-- MAIN CONTENT -->
  <!-- ========================= -->

  <main class="dashboard-container">

    <!-- ========================= -->
    <!-- ADD EQUIPMENT FORM -->
    <!-- ========================= -->

    <section class="form-section">

      <h2>
        List New Equipment
      </h2>

      <form
        class="dashboard-form"
        onsubmit="saveEquipment(event)"
      >

        <input
          type="hidden"
          id="equipmentEditId"
        />

        <input
          type="text"
          id="equipmentName"
          placeholder="Equipment Name"
          required
        />

        <input
          type="number"
          id="equipmentRent"
          placeholder="Rent Per Day"
          required
        />

        <input
          type="text"
          id="equipmentLocation"
          placeholder="Location"
          required
        />

        <select
          id="equipmentAvailability"
          required
        >

          <option value="">
            Select Availability
          </option>

          <option value="Available">
            Available
          </option>

          <option value="Not Available">
            Not Available
          </option>

        </select>

        <input
          type="text"
          id="equipmentImage"
          placeholder="Equipment Image URL"
        />

        <button type="submit">

          Save Equipment

        </button>

      </form>

    </section>

    <!-- ========================= -->
    <!-- EQUIPMENT LIST -->
    <!-- ========================= -->

    <section>

      <h2>
        Available Equipment
      </h2>

      <div
        class="grid cards-grid"
        id="equipmentList"
      >
      </div>

    </section>

  </main>

  <!-- ========================= -->
  <!-- SCRIPT -->
  <!-- ========================= -->

  <script src="app.js"></script>

</body>

</html>
