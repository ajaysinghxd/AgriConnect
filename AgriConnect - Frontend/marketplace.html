<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        AgriConnect Marketplace
    </title>

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/marketplace.css" />

</head>

<body>

    <!-- CURSOR -->

    <div class="cursor-glow"></div>

    <!-- BACKGROUND GLOW -->

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">
                ◉
            </span>

            AgriConnect

        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="marketplace.html">
                Marketplace
            </a>

            <a href="#">
                Categories
            </a>

            <a href="#">
                Sellers
            </a>

            <a href="#">
                Contact
            </a>

        </nav>

        <div class="nav-buttons">

            <a
                href="login.html"
                class="btn-secondary"
            >
                Login
            </a>

            <a
                href="signup.html"
                class="btn-primary"
            >
                Sell Products
            </a>

        </div>

    </header>

    <!-- =========================
         MARKETPLACE HERO
    ========================== -->

    <section class="marketplace-hero">

        <div class="marketplace-hero-content">

            <span class="marketplace-tag">
                DIGITAL AGRICULTURE MARKETPLACE
            </span>

            <h1>
                Explore Premium
                Agricultural Products
            </h1>

            <p>
                Discover crops, farming equipment,
                fertilizers, seeds, and smart agriculture
                solutions inside the AgriConnect ecosystem.
            </p>

            <!-- SEARCH -->

            <div class="market-search">

                <input
                    type="text"
                    placeholder="Search crops, tractors, fertilizers..."
                />

                <button>
                    Search
                </button>

            </div>

        </div>

    </section>

    <!-- =========================
         MAIN MARKETPLACE
    ========================== -->

    <section class="marketplace-main">

        <!-- SIDEBAR -->

        <aside class="market-sidebar">

            <h3>
                Categories
            </h3>

            <div class="filter-list">

                <button class="active">
                    All Products
                </button>

                <button>
                    Crops
                </button>

                <button>
                    Equipment
                </button>

                <button>
                    Fertilizers
                </button>

                <button>
                    Seeds
                </button>

                <button>
                    Organic Products
                </button>

            </div>

        </aside>

        <!-- PRODUCT AREA -->

        <div
            class="market-products"
            id="market-products"
        >

            <!-- PRODUCTS LOAD DYNAMICALLY -->

        </div>

    </section>

    <!-- JS -->

    <script src="js/effects.js"></script>
    <script src="js/marketplace.js"></script>

</body>

</html>
