<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Farmer Dashboard
    </title>

    <!-- FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/dashboard.css" />

</head>

<body>

    <!-- CURSOR -->

    <div class="cursor-glow"></div>

    <!-- SIDEBAR -->

    <aside class="dashboard-sidebar">

        <div class="dashboard-logo">

            <span>
                ◉
            </span>

            AgriConnect

        </div>

        <nav class="dashboard-nav">

            <a class="active" href="#">
                Dashboard
            </a>

            <a href="#">
                Products
            </a>

            <a href="#">
                Orders
            </a>

            <a href="#">
                Analytics
            </a>

            <a href="#">
                Inventory
            </a>

            <a href="#">
                Settings
            </a>

        </nav>

    </aside>

    <!-- MAIN -->

    <main class="dashboard-main">

        <!-- TOP -->

        <div class="dashboard-top">

            <div>

                <span class="dashboard-tag">
                    FARMER PANEL
                </span>

                <h1 id="welcome-user">
                    Welcome Back
                </h1>

            </div>

            <button
                class="dashboard-btn"
                id="open-upload-modal"
            >
                + Upload Product
            </button>

        </div>

        <!-- LIVE STATS -->

        <div class="stats-grid">

            <div class="stat-card">

                <span>
                    Total Products
                </span>

                <h2 id="farmer-products">
                    0
                </h2>

            </div>

            <div class="stat-card">

                <span>
                    Total Orders
                </span>

                <h2 id="farmer-orders">
                    0
                </h2>

            </div>

            <div class="stat-card">

                <span>
                    Revenue
                </span>

                <h2 id="farmer-revenue">
                    ₹0
                </h2>

            </div>

            <div class="stat-card">

                <span>
                    Customers
                </span>

                <h2 id="farmer-customers">
                    0
                </h2>

            </div>

        </div>

        <!-- INVENTORY -->

        <section class="dashboard-section">

            <div class="section-title">

                <h3>
                    Inventory Management
                </h3>

            </div>

            <div class="dashboard-table">

                <!-- TABLE HEAD -->

                <div class="table-row table-head">

                    <span>
                        Product
                    </span>

                    <span>
                        Category
                    </span>

                    <span>
                        Stock
                    </span>

                    <span>
                        Price
                    </span>

                    <span>
                        Actions
                    </span>

                </div>

                <!-- LIVE PRODUCTS -->

                <div id="farmer-products-container">

                </div>

            </div>

        </section>

        <!-- AI CROP RECOMMENDATION -->

        <section class="dashboard-section ai-section">

            <div class="section-title">

                <h3>
                    AI Crop Recommendation
                </h3>

            </div>

            <div class="ai-card">

                <div class="ai-form">

                    <select id="soil-type">

                        <option value="">
                            Select Soil Type
                        </option>

                        <option value="black">
                            Black Soil
                        </option>

                        <option value="red">
                            Red Soil
                        </option>

                        <option value="clay">
                            Clay Soil
                        </option>

                        <option value="sandy">
                            Sandy Soil
                        </option>

                    </select>

                    <select id="season">

                        <option value="">
                            Select Season
                        </option>

                        <option value="summer">
                            Summer
                        </option>

                        <option value="winter">
                            Winter
                        </option>

                        <option value="monsoon">
                            Monsoon
                        </option>

                    </select>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Temperature °C"
                    />

                    <button
                        class="dashboard-btn"
                        id="predict-btn"
                    >
                        Generate Recommendation
                    </button>

                </div>

                <div class="ai-result">

                    <h2 id="crop-result">
                        Smart AI Suggestions Will Appear Here
                    </h2>

                </div>

            </div>

        </section>

    </main>

    <!-- =========================
         PRODUCT UPLOAD MODAL
    ========================== -->

    <div
        class="upload-modal"
        id="upload-modal"
    >

        <div class="upload-modal-content">

            <h2>
                Upload Product
            </h2>

            <form id="upload-product-form">

                <input
                    type="text"
                    id="product-name"
                    placeholder="Product Name"
                    required
                />

                <input
                    type="number"
                    id="product-price"
                    placeholder="Price"
                    required
                />

                <input
                    type="number"
                    id="product-quantity"
                    placeholder="Quantity"
                    required
                />

                <input
                    type="text"
                    id="product-location"
                    placeholder="Location"
                    required
                />

                <input
                    type="text"
                    id="product-category"
                    placeholder="Category"
                    required
                />

                <input
                    type="text"
                    id="product-image"
                    placeholder="Image URL"
                    required
                />

                <button
                    type="submit"
                    class="dashboard-btn"
                >
                    Upload Product
                </button>

            </form>

        </div>

    </div>

    <!-- JS -->

    <script src="js/effects.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
