<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        AgriConnect Signup
    </title>

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/auth.css" />

</head>

<body>

    <!-- CURSOR -->

    <div class="cursor-glow"></div>

    <!-- BACKGROUND GLOW -->

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- =========================
         AUTH WRAPPER
    ========================== -->

    <section class="auth-wrapper">

        <!-- LEFT SIDE -->

        <div class="auth-left">

            <span class="auth-tag">
                JOIN AGRICONNECT
            </span>

            <h1>
                Create Account
            </h1>

            <p>
                Join the next-generation digital agriculture
                ecosystem designed for smart farming,
                AI-powered insights and intelligent
                marketplace experiences.
            </p>

        </div>

        <!-- RIGHT SIDE -->

        <div class="auth-right">

            <div class="auth-card">

                <h2>
                    Sign Up
                </h2>

                <!-- FORM -->

                <form
                    id="signupForm"
                    class="signup-form"
                >

                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required
                        />

                    </div>

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        />

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                        />

                    </div>

                    <!-- ROLE -->

                    <div class="input-group">

                        <label>
                            Select Role
                        </label>

                        <select
                            id="role"
                            required
                        >

                            <option value="">
                                Choose Role
                            </option>

                            <option value="farmer">
                                Farmer
                            </option>

                            <option value="buyer">
                                Buyer
                            </option>

                        </select>

                    </div>

                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>

                </form>

                <!-- FOOTER -->

                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- JS -->

    <script src="./js/effects.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
